name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Draft release for the package.json version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --notes "**npm:** https://www.npmjs.com/package/@leostacowski/pkgs" \
            --draft
